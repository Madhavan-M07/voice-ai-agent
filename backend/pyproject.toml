[project]
name = "voice-agent"
version = "0.1.0"
description = "Real-time voice AI agent: streaming STT -> LangGraph agent -> TTS over WebRTC, on a free/local model stack."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# OneDrive folders reject hardlinks (os error 396); copy files into the venv instead.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["voice_agent"]
